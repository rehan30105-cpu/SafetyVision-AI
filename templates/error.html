<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ code }} — SafetyVision AI</title>
<style>:root{color-scheme:light;--ivory:#F7F5F0;--charcoal:#17191A;--orange:#F26A21;--line:#E0DDD6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ivory);color:var(--charcoal);font:16px/1.6 'IBM Plex Sans',system-ui,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,560px);background:#fffefa;border:1px solid var(--line);padding:clamp(28px,6vw,56px)}.mark{font:700 .8rem/1.2 system-ui,sans-serif;letter-spacing:.12em;color:var(--orange);text-transform:uppercase}.code{margin:34px 0 4px;font:600 clamp(3rem,12vw,5rem)/1 Georgia,serif}.title{font:600 clamp(1.6rem,5vw,2.3rem)/1.2 Georgia,serif;margin:12px 0}.message{color:#454745;max-width:44ch}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{display:inline-block;padding:10px 16px;background:var(--charcoal);color:white;text-decoration:none;font-weight:600}.button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.button.secondary{background:transparent;border:1px solid #c8c4bc;color:var(--charcoal)}</style></head>
<body><main class="panel"><div class="mark">SafetyVision AI · Access control</div><div class="code">{{ code }}</div><h1 class="title">{{ title }}</h1><p class="message">{{ message }}</p><div class="actions"><a class="button" href="{{ url_for('landing') }}">Return to SafetyVision</a><a class="button secondary" href="{{ url_for('login') }}">Sign in</a></div></main></body></html>
