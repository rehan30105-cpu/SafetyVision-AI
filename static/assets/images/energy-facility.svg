<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" aria-label="Energy heavy industry facility">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF7F0"/>
      <stop offset="100%" stop-color="#F5EFE4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color:#E8E2D8/>
      <stop offset="100%" stop-color:#D9D2C4/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <rect y="520" width="1200" height="180" fill="url(#ground)"/>
  <!-- Distant horizon structures -->
  <rect x="60" y="430" width="340" height="90" fill="#C7C0B3" opacity="0.5"/>
  <rect x="440" y="420" width="260" height="100" fill="#BDB4A6" opacity="0.5"/>
  <rect x="740" y="440" width="220" height="80" fill="#BDB4A6" opacity="0.45"/>
  <rect x="1000" y="425" width="150" height="95" fill="#C7C0B3" opacity="0.5"/>
  <!-- Cooling towers (energy facility silhouette) -->
  <g fill="none" stroke="#8E8678" stroke-width="6" stroke-linecap="round">
    <path d="M230 520 L200 360 L260 360 Z"/>
    <path d="M520 520 L485 350 L555 350 Z"/>
    <path d="M850 520 L815 380 L885 380 Z"/>
    <path d="M1060 520 L1030 400 L1090 400 Z"/>
  </g>
  <g fill="#8E8678">
    <circle cx="230" cy="350" r="14"/>
    <circle cx="520" cy="340" r="14"/>
    <circle cx="850" cy="370" r="14"/>
    <circle cx="1060" cy="390" r="14"/>
  </g>
  <!-- Piping / rack structures -->
  <g stroke="#AEA594" stroke-width="5" opacity="0.7">
    <path d="M150 520 L150 470 L260 470 L260 520"/>
    <path d="M430 520 L430 455 L560 455 L560 520"/>
    <path d="M730 520 L730 480 L860 480 L860 520"/>
    <path d="M970 520 L970 465 L1110 465 L1110 520"/>
  </g>
  <!-- Tall exhaust stack -->
  <g fill="#9FA6A0">
    <rect x="575" y="430" width="34" height="90" rx="6"/>
    <rect x="570" y="424" width="44" height="8" rx="3"/>
  </g>
  <path d="M592 430 L610 360 L605 430" fill="#CFC6BA" opacity="0.6"/>
  <!-- Foreground equipment / tanks -->
  <g fill="#BDB4A6" stroke="#8E8678" stroke-width="3">
    <rect x="300" y="500" width="70" height="20" rx="4"/>
    <rect x="300" y="520" width="70" height="24" rx="4"/>
    <circle cx="335" cy="500" r="10" fill="#9FA6A0"/>
    <rect x="880" y="505" width="60" height="18" rx="4"/>
    <rect x="880" y="523" width="60" height="22" rx="4"/>
    <circle cx="910" cy="505" r="10" fill="#9FA6A0"/>
  </g>
  <!-- Safety/orange accent detail -->
  <rect x="295" y="496" width="80" height="4" fill="#F26A21" opacity="0.9"/>
  <rect x="875" y="501" width="70" height="4" fill="#F26A21" opacity="0.9"/>
  <!-- Ground detail lines -->
  <g stroke="#C9C0B4" stroke-width="2" opacity="0.6">
    <path d="M0 560 L1200 560"/>
    <path d="M0 620 L1200 620"/>
    <path d="M0 680 L1200 680"/>
  </g>
</svg>
